<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sesi Foto — Jonas Photo</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .photo-wrap {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .photo-main {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-height: 0;
    }
    .camera-panel {
      position: relative; background: #000;
      flex: 1; min-height: 0;
      display: flex; align-items: center;
      justify-content: center; overflow: hidden;
    }
    #videoEl {
      width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    .camera-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; pointer-events: none; z-index: 10;
    }
    .countdown-number {
      font-family: var(--font-display);
      font-size: 240px; font-weight: 300;
      color: #fff; opacity: 0; line-height: 1;
      text-shadow: 0 0 120px rgba(0, 0, 0, 0.7);
      letter-spacing: -0.02em;
      transition: none;
    }
    .countdown-number.show {
      animation: countPop 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes countPop {
      0%   { opacity: 0; transform: scale(1.6); }
      20%  { opacity: 1; transform: scale(1); }
      80%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.85); }
    }
    .camera-flash {
      position: absolute; inset: 0;
      background: #fff; opacity: 0;
      pointer-events: none; z-index: 20;
    }
    .camera-flash.flash { animation: flashAnim 0.4s ease forwards; }
    @keyframes flashAnim {
      0%   { opacity: 0.9; }
      100% { opacity: 0; }
    }
    .freeze-preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background:
        radial-gradient(circle at 14% 18%, rgba(138, 150, 174, 0.26) 0%, transparent 48%),
        radial-gradient(circle at 86% 82%, rgba(1, 57, 94, 0.34) 0%, transparent 42%),
        rgba(1, 57, 94, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }
    .freeze-preview-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .freeze-preview-card {
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
      overflow: hidden;
      background: var(--bg-elevated);
      border: none;
      box-shadow: none;
      transform: scale(0.99);
      opacity: 0.98;
      transition: transform 0.24s ease, opacity 0.24s ease;
      display: flex;
      flex-direction: column;
    }
    .freeze-preview-overlay.show .freeze-preview-card {
      transform: scale(1);
      opacity: 1;
    }
    .freeze-preview-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 22px 12px;
      background: linear-gradient(180deg, rgba(220, 221, 221, 0.92) 0%, rgba(220, 221, 221, 0.7) 100%);
      border-bottom: 1px solid rgba(1, 57, 94, 0.22);
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 600;
    }
    .freeze-preview-header strong {
      color: var(--gold);
      font-weight: 600;
    }
    .freeze-preview-frame {
      flex: 1;
      min-height: 0;
      background: var(--bg);
    }
    .freeze-preview-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: transparent;
    }
    .camera-guide {
      position: absolute; width: 32px; height: 32px;
      z-index: 5; opacity: 0.35;
    }
    .camera-guide--tl { top: 28px; left: 28px; border-top: 1.5px solid #fff; border-left: 1.5px solid #fff; border-top-left-radius: 3px; }
    .camera-guide--tr { top: 28px; right: 28px; border-top: 1.5px solid #fff; border-right: 1.5px solid #fff; border-top-right-radius: 3px; }
    .camera-guide--bl { bottom: 28px; left: 28px; border-bottom: 1.5px solid #fff; border-left: 1.5px solid #fff; border-bottom-left-radius: 3px; }
    .camera-guide--br { bottom: 28px; right: 28px; border-bottom: 1.5px solid #fff; border-right: 1.5px solid #fff; border-bottom-right-radius: 3px; }
    .session-timer-bar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .session-timer-fill {
      height: 100%; background: var(--gold);
      transition: width 1s linear; width: 100%;
      box-shadow: 0 0 12px var(--gold-dim);
    }
    .session-timer-fill.warning {
      background: var(--blush);
      box-shadow: 0 0 12px rgba(138, 150, 174, 0.4);
    }
    .session-time-display {
      position: absolute; top: 22px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 100px;
      padding: 8px 22px; font-size: 13px;
      font-weight: 500; color: #fff; z-index: 12;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .session-time-display.warning {
      color: var(--blush);
      border-color: rgba(138, 150, 174, 0.4);
      background: rgba(35, 40, 55, 0.55);
    }
    .camera-placeholder {
      display: none; flex-direction: column;
      align-items: center; gap: 18px;
      text-align: center; padding: 40px;
    }
    .camera-placeholder svg { opacity: 0.3; }
    .camera-placeholder p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

    /* ── HUD: transparent positioning layer ─────────────── */
    .camera-hud {
      position: absolute;
      inset: 0;
      z-index: 16;
      background: transparent;
      border: none;
      border-radius: 0;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      padding: 0;
      gap: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    /* ── Top-right: meta pills floating ─────────────────── */
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 18px 22px 0;
      pointer-events: auto;
    }
    .hud-copy { display: none; }
    .hud-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .photo-count-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #d8dfea;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .photo-count-pill strong {
      font-family: var(--font-display);
      font-size: 18px; color: #fff;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }

    .auto-capture-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #dbe4f1;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-4px);
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .auto-capture-pill.show {
      opacity: 1;
      transform: translateY(0);
    }
    .auto-capture-pill strong {
      font-family: var(--font-display);
      font-size: 18px;
      color: #fff;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }
    .auto-capture-pill.active {
      border-color: rgba(240, 201, 106, 0.5);
      background: rgba(40, 30, 14, 0.7);
      color: #f1dbab;
      box-shadow:
        0 0 24px rgba(240, 201, 106, 0.28),
        0 4px 16px rgba(0, 0, 0, 0.3);
      animation: autoCapturePulse 1.4s ease-in-out infinite;
    }
    @keyframes autoCapturePulse {
      0%, 100% { box-shadow: 0 0 24px rgba(240, 201, 106, 0.28), 0 4px 16px rgba(0, 0, 0, 0.3); }
      50%      { box-shadow: 0 0 32px rgba(240, 201, 106, 0.45), 0 4px 16px rgba(0, 0, 0, 0.3); }
    }

    #doneBtn {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 6px 20px rgba(1, 57, 94, 0.4);
    }

    /* ── Bottom: gradient fade + status + preset strip ──── */
    .preset-status-row {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 90px 22px 18px;
      background: linear-gradient(to top,
        rgba(1, 57, 94, 0.45) 0%,
        rgba(1, 57, 94, 0.25) 40%,
        rgba(1, 57, 94, 0.08) 75%,
        transparent 100%);
      pointer-events: auto;
    }

    .preset-progress { display: none; }

    .preset-status-line {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Hide the redundant "10 preset realtime" label — only keep the dynamic status */
    .preset-status-line .preset-status-text + .preset-status-text {
      display: none;
    }
    .preset-status-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.06em;
      line-height: 1.4;
      text-align: center;
      max-width: 720px;
    }
    .preset-status-text strong {
      color: #fff;
      font-weight: 500;
    }

    .preset-strip {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 6px;
    }
    .preset-chip {
      position: relative;
      min-height: 46px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 6px 4px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .preset-chip::before {
      content: '';
      position: absolute;
      inset: auto 12px 6px 12px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      transition: all 0.25s ease;
    }
    .preset-chip-icon {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.26);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
      transition: all 0.25s ease;
    }
    .preset-chip-label { display: none; }

    .preset-chip-number {
      font-family: var(--font-display);
      font-size: 18px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.78);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .preset-chip.active {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(42, 35, 20, 0.85) 0%, rgba(24, 19, 7, 0.95) 100%);
      color: var(--gold);
      box-shadow:
        0 0 0 1px rgba(240, 201, 106, 0.3) inset,
        0 0 28px rgba(240, 201, 106, 0.3);
      transform: translateY(-3px);
    }
    .preset-chip.active .preset-chip-icon {
      background: linear-gradient(180deg, var(--gold), #f9e4a8);
      box-shadow:
        0 0 0 4px rgba(240, 201, 106, 0.14),
        0 0 14px rgba(240, 201, 106, 0.72);
      transform: scale(1.1);
    }
    .preset-chip.active::before {
      background: linear-gradient(90deg, var(--gold), #f9e4a8);
      box-shadow: 0 0 8px rgba(240, 201, 106, 0.6);
    }
    .preset-chip.active .preset-chip-number {
      color: #f9e4a8;
      font-size: 20px;
    }

    /* ── Session ended overlay ──────────────────────────── */
    .session-ended {
      display: none; position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 30; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; text-align: center; padding: 40px;
    }
    .session-ended.show { display: flex; }
    .session-ended h3 {
      font-family: var(--font-display);
      font-size: 48px; font-weight: 300; color: var(--cream);
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .session-ended p {
      font-size: 14px; color: var(--text-secondary);
      line-height: 1.7;
      max-width: 380px;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 980px) {
      .photo-main { flex-direction: column; }
      .hud-header { padding: 14px 16px 0; flex-wrap: wrap; }
      .preset-status-row { padding: 80px 16px 14px; }
    }

    @media (max-width: 680px) {
      .countdown-number { font-size: 140px; }

      .preset-strip {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .preset-status-row {
        padding: 90px 14px 12px;
        gap: 8px;
      }

      .camera-guide { width: 24px; height: 24px; }
      .camera-guide--tl, .camera-guide--tr { top: 14px; }
      .camera-guide--bl, .camera-guide--br { bottom: 14px; }
      .camera-guide--tl, .camera-guide--bl { left: 14px; }
      .camera-guide--tr, .camera-guide--br { right: 14px; }
    }

    @media (max-width: 460px) {
      .hud-header { padding: 12px 12px 0; gap: 8px; }
      .hud-meta { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

      .session-time-display {
        top: 14px;
        padding: 6px 16px;
        font-size: 12px;
      }

      .preset-status-row { padding: 80px 12px 10px; }
      .preset-strip { gap: 5px; }
      .preset-chip { min-height: 42px; }
      .preset-chip-number { font-size: 16px; }
      .preset-chip.active .preset-chip-number { font-size: 18px; }

      .photo-count-pill,
      .auto-capture-pill {
        padding: 7px 12px;
        font-size: 9px;
      }
      .photo-count-pill strong,
      .auto-capture-pill strong { font-size: 16px; }

      .preset-status-text { font-size: 10px; }
    }

    @media (max-height: 760px) {
      .preset-status-row { padding-top: 70px; }
      .session-time-display { top: 14px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .photo-main { flex-direction: column; }

      .preset-status-row {
        padding: 60px 16px 10px;
        gap: 6px;
      }
      .preset-status-line { display: none; }
      .preset-chip { min-height: 36px; }
      .preset-chip-number { font-size: 14px; }
      .preset-chip.active .preset-chip-number { font-size: 16px; }
      .countdown-number { font-size: 110px; }
    }
  </style>
</head>
<body>
  <div class="photo-wrap">
    <nav class="nav">
      <span class="nav-logo">Jonas Photo</span>
      <div class="nav-steps">
        <div class="nav-step done"></div>
        <div class="nav-step done"></div>
        <div class="nav-step active"></div>
        <div class="nav-step"></div>
        <div class="nav-step"></div>
        <div class="nav-step"></div>
      </div>
      <span class="label">Langkah 3 / 6</span>
    </nav>

    <div class="photo-main">
      <div class="camera-panel">
        <div class="session-timer-bar">
          <div class="session-timer-fill" id="timerFill"></div>
        </div>
        <div class="session-time-display" id="sessionTimeDisplay">00:00</div>
        <div class="camera-guide camera-guide--tl"></div>
        <div class="camera-guide camera-guide--tr"></div>
        <div class="camera-guide camera-guide--bl"></div>
        <div class="camera-guide camera-guide--br"></div>
        <video id="videoEl" autoplay playsinline muted></video>
        <div class="camera-placeholder" id="cameraPlaceholder">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <rect x="8" y="18" width="48" height="36" rx="4" stroke="var(--text-muted)" stroke-width="2"/>
            <circle cx="32" cy="36" r="10" stroke="var(--text-muted)" stroke-width="2"/>
            <circle cx="32" cy="36" r="4" fill="var(--text-muted)"/>
            <path d="M24 18l4-6h8l4 6" stroke="var(--text-muted)" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <p>Kamera tidak terdeteksi.<br/>Pastikan izin kamera sudah diberikan.</p>
          <button class="btn btn-secondary btn-sm" onclick="initCamera()">Coba Lagi</button>
        </div>
        <div class="camera-overlay">
          <div class="countdown-number" id="countdownNum"></div>
        </div>
        <div class="camera-flash" id="cameraFlash"></div>

        <div class="camera-hud">
          <div class="hud-header">
            <div class="hud-copy">
              <div class="hud-label">Preset aktif</div>
              <div class="hud-title" id="presetStatusLabel">Menunggu preset</div>
            </div>
            <div class="hud-meta">
              <div class="auto-capture-pill" id="autoCapturePill" aria-live="polite">
                Auto capture <strong id="autoCaptureCountdown">5s</strong>
              </div>
              <div class="photo-count-pill">Foto <strong id="photoCount">0</strong></div>
              <button class="btn btn-primary btn-sm" id="doneBtn" onclick="goToFrame()" style="display:none;">
                Selesai →
              </button>
            </div>
          </div>

          <div class="preset-status-row">
            <div class="preset-status-line">
              <div class="preset-status-text" id="presetStatusText">Bar preset akan aktif saat robot berjalan.</div>
              <div class="preset-status-text"><strong>10 preset</strong> realtime</div>
            </div>
            <div class="preset-progress" id="presetProgress">
              <div class="preset-progress-fill" id="presetProgressFill"></div>
            </div>
            <div class="preset-strip" id="presetStrip"></div>
          </div>
        </div>

        <div class="session-ended" id="sessionEnded">
          <h3>Waktu Habis!</h3>
          <p>Sesi foto kamu telah selesai.<br/>Lanjutkan untuk memilih foto terbaikmu.</p>
          <button class="btn btn-primary" onclick="goToFrame()">Pilih Frame →</button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="captureCanvas" style="display:none"></canvas>

  <script src="assets/js/session.js"></script>
  <script src="assets/js/shared.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/photo-page.js"></script>
</body>
</html>
